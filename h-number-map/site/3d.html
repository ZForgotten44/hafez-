/* Layout: one full-height 3D stage under a sky gradient; a pill toolbar floats over it; a card names the lot; a transport bar appears while walking. */
:root{color-scheme:light;--bg:#dcdad2;--fg:#0b0b0a;--g3:#b3b1a6;--g4:#8f8d82;--g5:#4b4a44;--surf:#efede7;--rule:#a7a59a;--acc:#c5a448;--acc-ink:#0b0b0a;
  --sky:linear-gradient(180deg,#5f93c9 0%,#a9c8e6 32%,#dfe3dc 49%,#dfe3dc 100%);--fog:#dfe3dc;
  --sans:'Space Grotesk',ui-sans-serif,system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0b0b0a;--fg:#f4f2ec;--g3:#2b2b28;--g4:#45443f;--g5:#b9b7af;--surf:#181817;--rule:#45443f;--sky:linear-gradient(180deg,#0a1220 0%,#1c2c44 36%,#33465a 50%,#33465a 100%);--fog:#33465a}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 16px/1.5 var(--sans);overflow:hidden}
#stage{position:fixed;inset:0;background:var(--sky)}
#stage canvas{display:block;width:100%;height:100%;outline:none;touch-action:none}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
#labels div{position:absolute;transform:translate(-50%,-50%);font:600 12px/1.15 var(--mono);color:#fff;text-align:center;text-shadow:0 0 3px #000,0 0 3px #000,0 1px 2px #000;white-space:nowrap}
#labels div small{display:block;font-weight:500;opacity:.92}
#tag{position:fixed;left:0;top:0;pointer-events:none;display:none;transform:translate(-50%,-100%);text-align:center;z-index:2}
#tag b{display:block;padding:7px 16px;border-radius:99px;background:var(--acc);color:var(--acc-ink);font:700 20px/1 var(--mono);letter-spacing:.02em;box-shadow:0 6px 20px rgba(0,0,0,.35)}
#tag span{display:block;margin:5px auto 0;width:max-content;padding:2px 10px;border-radius:99px;background:rgba(11,11,10,.62);color:#fff;font:500 11.5px var(--mono)}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:max(14px,env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;justify-content:center;max-width:calc(100vw - 24px);padding:10px 16px;background:var(--surf);border:1px solid var(--rule);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.bar label,.pop label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--g5);display:flex;align-items:center;gap:7px}
.seg{display:inline-flex}
.btn,select,input[type=number]{font:600 13px var(--sans);color:var(--fg);background:transparent;border:1.5px solid var(--g4);border-radius:12px;min-height:38px;padding:0 13px;cursor:pointer}
input[type=number]{width:96px;cursor:text;background:var(--bg)}
select{background:var(--bg)}
.btn:hover{border-color:var(--fg)}
.seg .btn{border-radius:0;margin-right:-1.5px}.seg .btn:first-child{border-radius:12px 0 0 12px}.seg .btn:last-child{border-radius:0 12px 12px 0;margin-right:0}
.btn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.btn.go{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
input[type=range]{accent-color:var(--fg);width:110px}
.btn:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.top{position:fixed;left:max(14px,env(safe-area-inset-left,0px));top:max(14px,env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:10px;max-width:min(380px,calc(100vw - 28px))}
.card{background:var(--surf);border:1px solid var(--rule);border-radius:20px;padding:14px 18px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.card h1{font:700 22px/1.1 var(--sans);letter-spacing:-.02em;margin:0 0 4px}
.card p{margin:0;font-size:13.5px;color:var(--g5)}
#info b{font:700 20px var(--mono)} #info .k{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--g5);display:block;margin-bottom:2px}
#info .row2{display:flex;gap:18px;flex-wrap:wrap;margin-top:6px}
#load{position:fixed;inset:0;display:grid;place-items:center;background:var(--bg);z-index:5;font:500 14px var(--mono);color:var(--g5);transition:opacity .4s}
.legend{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);color:var(--g5)}
.legend i{display:inline-block;width:110px;height:10px;border-radius:99px;background:linear-gradient(90deg,hsl(40,62%,82%),hsl(40,62%,32%))}
.credit{position:fixed;right:12px;top:max(12px,env(safe-area-inset-top,0px));font:500 10.5px var(--mono);color:#fff;text-shadow:0 0 3px #000;opacity:.85;text-align:right;max-width:280px}
.pop{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 66px);display:none;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 22px;padding:16px 18px;background:var(--surf);border:1px solid var(--rule);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.28);max-width:calc(100vw - 24px)}
.pop.on{display:grid}
.pop label{flex-direction:column;align-items:flex-start;gap:5px}.pop select,.pop input[type=range]{width:100%}
.wbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 66px);display:none;align-items:center;gap:12px;padding:10px 16px;background:var(--surf);border:1px solid var(--rule);border-radius:26px;box-shadow:0 10px 30px rgba(0,0,0,.25);width:min(720px,calc(100vw - 24px))}
.wbar.on{display:flex}.walking .pop{bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + 140px)}.wbar input[type=range]{flex:1;width:auto;min-width:0}
.wbar .rd{font:700 15px var(--mono);min-width:76px}
.wbar .sp{font:500 11px var(--mono);color:var(--g5);display:flex;gap:6px;align-items:center}.wbar .sp input{width:80px}
@media (max-width:760px){.top .card:last-child{display:none}.bar{border-radius:20px;padding:8px 10px}.credit{display:none}.wbar{flex-wrap:wrap;border-radius:20px}.wbar .sp{display:none}}
</style>
<div id="stage"></div><div id="labels"></div><div id="tag"><b></b><span></span></div>
<div id="load">Building the cemetery…</div>
<div class="top"><div class="card"><h1>Cedar Grove in 3D</h1><p>Drag to orbit, scroll to zoom, or press Walk for a glide along the numbering.</p></div>
<div class="card" id="info" aria-live="polite"><span class="k">Lot under the pointer</span><span style="color:var(--g5);font-size:13.5px">Point at a headstone, or type an H-number below.</span></div></div>
<div class="credit" id="credit"></div>
<div class="pop" id="pop">
<label>Colour<select id="cmode"><option value="real">Realistic stone</option><option value="h">H-number (gold)</option><option value="sec">Old section</option><option value="old">Old label</option></select></label>
<label>Pass<select id="pass"><option value="0">All six</option><option value="1">Pass 1 · B, A</option><option value="2">Pass 2 · D, C</option><option value="3">Pass 3 · F, E</option><option value="4">Pass 4 · margins, G, H</option><option value="5">Pass 5 · M</option><option value="6">Pass 6 · K, J, I, L</option></select></label>
<label>Season<select id="season"><option value="summer">Summer</option><option value="autumn">Autumn</option><option value="spring">Spring</option><option value="bare">Bare (early spring)</option></select></label>
<label>Walk camera<select id="wstyle"><option value="glide">Glide above</option><option value="eye">Eye level</option></select></label>
<label>Sun<input id="sun" type="range" min="0" max="100" value="38" aria-label="Sun position"></label>
<span class="legend" id="leg"><i></i>first lot to last lot</span>
</div>
<div class="wbar" id="wbar"><button class="btn go" id="play" type="button">Pause</button><span class="rd" id="wread">H000001</span><input id="seek" type="range" min="0" max="100" value="0" aria-label="Position along the path"><label class="sp">Speed<input id="speed" type="range" min="2" max="30" value="7" aria-label="Walking speed"></label></div>
<div class="bar" role="toolbar" aria-label="3D controls">
<div class="seg" role="group" aria-label="View"><button class="btn on" data-view="over" type="button">Overview</button><button class="btn" data-view="top" type="button">From above</button><button class="btn" data-view="walk" type="button">Walk</button></div>
<label>Go to H <input id="gh" type="number" min="1" max="3185" placeholder="1698" aria-label="H-number"></label><button class="btn go" id="gob" type="button">Fly there</button>
<button class="btn" id="opt" type="button" aria-expanded="false" aria-controls="pop">Options</button>
