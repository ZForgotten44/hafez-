<title>Cedar Grove Cemetery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout: header with search; browse sidebar | map | lot panel. One printed-map look, light by design. */
:root{
  color-scheme:light;
  --bg:#faf9f6; --surface:#ffffff; --surface-2:#f3f1ea; --line:#e2dfd6; --line-2:#cfcabd;
  --navy:#0c2340; --navy-2:#3a5578; --gold:#b8892f; --gold-soft:#efe3c8;
  --text:#1a2130; --mid:#566274; --faint:#7d8798;
  --ok:#2f6b46; --ok-bg:#e6f0e8; --review:#9a5b12; --review-bg:#f6e8d2; --danger:#a23325;
  --map:#fbfaf6; --label:#0c2340;
  --sans:'DM Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --serif:'Libre Baskerville',Georgia,serif;
  --mono:'DejaVu Sans Mono','DM Mono',ui-monospace,Menlo,Consolas,monospace;
  --r:8px; --shadow:0 8px 24px -8px rgba(12,35,64,.28),0 2px 6px rgba(12,35,64,.08);
  --panel-w:372px; --side-w:304px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--navy-2);outline-offset:2px}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}

#app{display:flex;flex-direction:column;height:100%}
header{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:8px 16px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto}
.brand .mark{width:32px;height:32px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font:700 12px var(--serif)}
.brand .nm{font:700 16px var(--serif);color:var(--navy);white-space:nowrap}
.search{position:relative;flex:1 1 auto;max-width:560px;min-width:0}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--faint);pointer-events:none}
#q{width:100%;height:42px;padding:0 38px 0 38px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2);font-size:15px}
#q:focus{outline:none;border-color:var(--navy-2);background:var(--surface);box-shadow:0 0 0 3px rgba(58,85,120,.15)}
#qx{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:30px;height:30px;border:0;background:none;color:var(--faint);border-radius:50%}
#qx:hover{background:var(--surface-2)}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r);box-shadow:var(--shadow);max-height:min(66vh,480px);overflow:auto;z-index:60}
.res{display:flex;gap:10px;align-items:center;justify-content:space-between;width:100%;text-align:left;padding:10px 14px;border:0;border-bottom:1px solid var(--line);background:none;min-height:48px}
.res:last-child{border-bottom:0}
.res:hover,.res.on{background:var(--surface-2)}
.res .h{font:700 14px var(--mono);color:var(--navy)}
.res .sub{font-size:12.5px;color:var(--mid)}
.res .tag{font-size:11px;font-weight:600;border-radius:99px;padding:2px 8px;white-space:nowrap}
.tag.ok{background:var(--ok-bg);color:var(--ok)} .tag.rv{background:var(--review-bg);color:var(--review)} .tag.nm{background:var(--gold-soft);color:#6b4d12}
.res-empty{padding:16px;color:var(--mid);font-size:13.5px}
.hbtns{display:flex;gap:8px;margin-left:auto;flex:0 0 auto}
.tbtn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 13px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);color:var(--navy);font-weight:600;font-size:13.5px;white-space:nowrap}
.tbtn:hover{background:var(--surface-2)} .tbtn svg{width:16px;height:16px}
.tbtn.on{background:var(--navy);color:#fff;border-color:var(--navy)}
#capnote{font-size:12px;color:var(--faint);white-space:nowrap}

main{flex:1;min-height:0;display:flex;position:relative}
aside#side{flex:0 0 var(--side-w);width:var(--side-w);background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
aside#side[hidden]{display:none}
.tabs{display:flex;border-bottom:1px solid var(--line);flex:0 0 auto}
.tab{flex:1;height:44px;border:0;background:none;font-weight:600;color:var(--mid);border-bottom:2px solid transparent}
.tab.on{color:var(--navy);border-bottom-color:var(--gold)}
.side-body{flex:1;overflow:auto;padding:14px 16px 24px}
.eyebrow{font:700 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:0 0 8px}
.area{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);margin-bottom:8px;min-height:56px}
.area:hover{border-color:var(--gold);background:#fffdf8}
.area b{display:block;color:var(--navy)} .area small{color:var(--mid);font-size:12.5px}
.area .rng{font:12px var(--mono);color:var(--mid);text-align:right}
.lnk{border:0;background:none;color:var(--navy-2);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:2px}
.field{display:block;width:100%;height:40px;padding:0 12px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface-2)}
.field:focus{outline:none;border-color:var(--navy-2);background:var(--surface)}
textarea.field{height:auto;min-height:64px;padding:9px 12px;resize:vertical}
.lotlist{margin-top:10px;border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.li{display:flex;justify-content:space-between;gap:8px;width:100%;padding:9px 12px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;min-height:42px;align-items:center}
.li:last-child{border-bottom:0} .li:hover{background:var(--surface-2)}
.li .h{font:700 13.5px var(--mono);color:var(--navy)} .li .l{font-size:12.5px;color:var(--mid)}
.note{font-size:12.5px;color:var(--mid);line-height:1.5}
.reason-h{font-weight:700;color:var(--review);font-size:13px;margin:16px 0 6px}

#mapwrap{position:relative;flex:1;min-width:0;background:var(--map);overflow:hidden;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#mapwrap.drag{cursor:grabbing}
#svg{display:block;width:100%;height:100%}
.b-lot{stroke-linejoin:round}
.lot{fill:var(--gold);fill-opacity:0;stroke:none;cursor:pointer}
.lot:hover{fill-opacity:.16}
.lot.hasrec{fill:#4f9a6a;fill-opacity:.2}
.lot.hasrec:hover{fill-opacity:.32}
.rv{fill:#f1dcc0;fill-opacity:.5;stroke:#c9892f;stroke-opacity:.85;stroke-width:1;stroke-dasharray:3 2;vector-effect:non-scaling-stroke;cursor:pointer}
.rv:hover{fill-opacity:.8}
.rv-dot{fill:#f1dcc0;fill-opacity:.8;stroke:#c9892f;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
.no-review #review{display:none}
#labels text{font-family:var(--mono);font-weight:700;fill:var(--label);text-anchor:middle;pointer-events:none}
#labels g{display:none} #labels g.show{display:block}
#sel{fill:var(--gold);fill-opacity:.28;stroke:var(--navy);stroke-width:2.2;vector-effect:non-scaling-stroke;pointer-events:none}
#hint{fill:var(--gold);fill-opacity:.07;stroke:var(--gold);stroke-width:1.6;stroke-dasharray:6 4;vector-effect:non-scaling-stroke;pointer-events:none}
#ann text{font-family:var(--sans);fill:#8a6f4a;opacity:.85;pointer-events:none}
.ctl{position:absolute;z-index:8}
#zoomctl{right:12px;bottom:12px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
#zoomctl button{display:flex;align-items:center;justify-content:center;gap:7px;min-width:48px;height:46px;border:0;border-bottom:1px solid var(--line);background:none;color:var(--navy);font-weight:600;font-size:13px;padding:0 12px}
#zoomctl button:last-child{border-bottom:0} #zoomctl button:hover:not(:disabled){background:var(--surface-2)} #zoomctl button:disabled{opacity:.4;cursor:default}
#zoomctl svg{width:17px;height:17px}
#layers{left:12px;top:12px}
.layers-btn{height:38px;display:inline-flex;align-items:center;gap:7px;padding:0 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);font-weight:600;font-size:13px;color:var(--navy)}
.layers-btn svg{width:15px;height:15px}
#layers-menu{margin-top:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;min-width:230px}
.lrow{display:flex;gap:9px;align-items:flex-start;padding:9px 8px;border-radius:6px;cursor:pointer;font-size:13.5px}
.lrow:hover{background:var(--surface-2)} .lrow input{margin-top:3px;accent-color:var(--navy);width:16px;height:16px}
.lrow small{display:block;color:var(--mid);font-size:12px}
#legend{left:12px;bottom:12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:8px 12px;font-size:12px;color:var(--mid);display:flex;gap:6px 14px;flex-wrap:wrap;max-width:min(520px,calc(100% - 110px))}
#legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:6px;vertical-align:-1px}
#legend .rvk{background:#f1dcc0;border:1px dashed #c9892f} #legend .rec{background:#bfe0c9;border:1px solid #4f9a6a}
#zoomhint{left:50%;top:12px;transform:translateX(-50%);background:var(--navy);color:#fff;font-size:12.5px;padding:6px 12px;border-radius:99px;box-shadow:var(--shadow);pointer-events:none}

aside#panel{flex:0 0 var(--panel-w);width:var(--panel-w);background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;z-index:20}
aside#panel[hidden]{display:none}
.p-head{display:flex;justify-content:space-between;gap:10px;padding:16px 16px 10px;align-items:flex-start;flex:0 0 auto}
.p-h{font:700 28px var(--mono);color:var(--navy);letter-spacing:-.02em;line-height:1.1}
.p-x{width:40px;height:40px;border:0;background:none;border-radius:50%;color:var(--mid);font-size:18px;flex:0 0 auto;margin:-6px -6px 0 0}
.p-x:hover{background:var(--surface-2)}
.p-body{flex:1;overflow:auto;padding:0 16px 24px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;border-radius:99px;padding:3px 10px}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.rv{background:var(--review-bg);color:var(--review)} .chip.gen{background:var(--surface-2);color:var(--mid)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:14px 0;font-size:14px}
.kv dt{color:var(--faint)} .kv dd{margin:0;font-weight:500;min-width:0;overflow-wrap:anywhere}
.box{border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:12px 0}
.box h3{margin:0 0 6px;font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.box.rvbox{background:#fdf6ea;border-color:#ecd3a9}
.empty{color:var(--mid);font-size:13.5px}
.rec{border-top:1px solid var(--line);padding:10px 0}
.rec:first-of-type{border-top:0}
.rec .nm{font-weight:700;font-size:16px}
.rec .d{color:var(--mid);font-size:13.5px}
.badge{font-size:11px;font-weight:700;border-radius:4px;padding:1px 6px;background:var(--surface-2);color:var(--mid)} .badge.v{background:var(--ok-bg);color:var(--ok)}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.btn{height:40px;padding:0 14px;border:1px solid var(--line-2);border-radius:var(--r);background:var(--surface);font-weight:600;font-size:13.5px;color:var(--navy)}
.btn:hover{background:var(--surface-2)} .btn.pri{background:var(--navy);border-color:var(--navy);color:#fff} .btn.pri:hover{background:#13315a}
.btn.dng{color:var(--danger)} .btn:disabled{opacity:.5;cursor:default}
.form label{display:block;font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--faint);margin:8px 0 3px}
.form .field{height:36px}.form textarea.field{height:auto;min-height:44px}.form details{margin-top:10px}.form summary{cursor:pointer;font-weight:600;color:var(--navy-2);font-size:13.5px;padding:6px 0}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .chk{display:flex;gap:8px;align-items:center;margin-top:8px;font-size:13.5px;text-transform:none;letter-spacing:0;font-weight:500;color:var(--text)}
.rform{border:1px solid var(--line-2);border-radius:var(--r);padding:2px 12px 8px;margin:8px 0;background:var(--surface-2)}
.status{font-size:12.5px;min-height:18px;margin-top:6px;color:var(--mid)} .status.ok{color:var(--ok)} .status.err{color:var(--danger)}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:10px 16px;border-radius:var(--r);font-weight:600;font-size:13.5px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:300;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%)}
.modal-ov{position:fixed;inset:0;background:rgba(12,20,35,.5);z-index:200;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:min(520px,100%);max-height:88vh;overflow:auto;padding:20px}
.modal h2{margin:0 0 4px;font-size:19px;color:var(--navy)}
.xopt{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px;margin-top:10px}
.xopt b{display:block;font-size:14px} .xopt small{color:var(--mid);font-size:12.5px}
.xgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;margin-top:8px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
table.t th{text-align:left;color:var(--faint);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:5px 6px;border-bottom:1px solid var(--line)}
table.t td{padding:5px 6px;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
.scrollx{overflow-x:auto}

@media (max-width:860px){
  :root{--panel-w:100%;--side-w:100%}
  .brand .nm{display:none} #capnote{display:none}
  header{gap:8px;padding:8px 12px} .tbtn .lbl{display:none} .tbtn{padding:0 11px}
  aside#side{position:absolute;inset:0;z-index:25;border:0}
  aside#panel{position:absolute;left:0;right:0;bottom:0;height:var(--sheet-h,46%);border-left:0;border-top:1px solid var(--line-2);border-radius:14px 14px 0 0;box-shadow:0 -10px 30px -10px rgba(12,35,64,.3)}
  .p-h{font-size:24px}
  #legend{display:none}
  #zoomctl{bottom:calc(12px + var(--sheet-px,0px))}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div id="app">
<header>
  <div class="brand"><div class="mark">CG</div><div class="nm">Cedar Grove Cemetery</div></div>
  <div class="search">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
    <label class="sr" for="q">Search H-number, legacy lot, or name</label>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search H-number, legacy lot (B 20H), or name">
    <button id="qx" type="button" aria-label="Clear search" hidden>&#10005;</button>
    <div id="results" role="listbox" hidden></div>
  </div>
  <span id="capnote"></span>
  <div class="hbtns">
    <button class="tbtn on" id="b-browse" type="button" aria-pressed="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h10"/></svg><span class="lbl">Browse map</span></button>
    <button class="tbtn" id="b-export" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg><span class="lbl">Export</span></button>
    <button class="tbtn" id="b-import" type="button" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 21V9m0 0l-4 4m4-4l4 4M5 3h14"/></svg><span class="lbl">Import records</span></button>
  </div>
</header>
<main>
  <aside id="side">
    <div class="tabs" role="tablist">
      <button class="tab on" id="t-areas" role="tab" type="button">Areas</button>
      <button class="tab" id="t-review" role="tab" type="button">To review</button>
    </div>
    <div class="side-body" id="side-body"></div>
  </aside>
  <div id="mapwrap">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" aria-label="Map of lots with H-numbers">
      <g id="base">__BASE__</g>
      <g id="ann" hidden=""></g>
      <g id="hintg"><polygon id="hint" points="" hidden=""/></g>
      <g id="review">__REVIEW__</g>
      <g id="lots">__LOTS__</g>
      <polygon id="sel" points="" hidden=""/>
      <g id="labels">__LABELS__</g>
    </svg>
    <div class="ctl" id="layers">
      <button class="layers-btn" id="layers-btn" type="button" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>Layers</button>
      <div id="layers-menu" hidden>
        <label class="lrow"><input type="checkbox" id="ly-review" checked><span>Lots to review<small>Outlined lots that could not be tied to one H-number.</small></span></label>
        <label class="lrow"><input type="checkbox" id="ly-ann"><span>Original drawing annotations<small>Road names, building names and the mausoleum legend from the source drawing.</small></span></label>
      </div>
    </div>
    <div class="ctl" id="zoomhint" hidden>Zoom in to read H-numbers</div>
    <div class="ctl" id="legend"><span>Numbers are H-numbers (H and leading zeros left off)</span><span><i class="rvk"></i>Needs review</span><span id="lg-rec" hidden><i class="rec"></i>Has grave records</span></div>
    <div class="ctl" id="zoomctl">
      <button id="z-in" type="button" aria-label="Zoom in"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg></button>
      <button id="z-out" type="button" aria-label="Zoom out"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg></button>
      <button id="z-fit" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Fit map</button>
      <button id="z-back" type="button" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 6l-6 6 6 6M4 12h16"/></svg>Back</button>
    </div>
  </div>
  <aside id="panel" hidden></aside>
</main>
</div>
<div class="toast" id="toast"></div>
<div id="modal-root"></div>

<script>
var DATA = /*__DATA__*/null;
(function(){
'use strict';
var LOTS=DATA.lots, REVIEW=DATA.review, UNPL=DATA.unplaced, AREAS=DATA.areas, REASONS=DATA.reasons, ANN=DATA.ann, CB=DATA.bbox, PDFS=DATA.pdfs;
// lot row: [d,h,s,l,hn,cx,cy,x0,y0,x1,y1,ev,labelOnly]
var $=function(id){return document.getElementById(id)};
function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML}
var tt;function toast(m){var t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('show')},2600)}
function copy(txt,label){function ok(){toast((label||'Copied')+' to clipboard')}
  function fb(){var a=document.createElement('textarea');a.value=txt;a.style.position='fixed';a.style.opacity='0';document.body.appendChild(a);a.select();try{document.execCommand('copy');ok()}catch(e){toast('Select and copy: '+txt)}a.remove()}
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(ok,fb)}else fb()}
function isMobile(){return window.matchMedia('(max-width:860px)').matches}

/* ---------- indexes ---------- */
var byH={},byLeg={},elLot=[];
LOTS.forEach(function(r,i){(byH[r[1]]=byH[r[1]]||[]).push(i);byLeg[r[2]+'|'+r[3]]=i});
Array.prototype.forEach.call(document.querySelectorAll('#lots [data-i]'),function(e){elLot[+e.getAttribute('data-i')]=e});
var elRv=[];Array.prototype.forEach.call(document.querySelectorAll('#review [data-r]'),function(e){elRv[+e.getAttribute('data-r')]=e});
function hnum(h){return parseInt(h.slice(1),10)}

/* ---------- camera ---------- */
var svg=$('svg'),wrap=$('mapwrap'),W=1,H=1,cam={x:(CB[0]+CB[2])/2,y:(CB[1]+CB[3])/2,s:.7},raf=null,anim=null,hist=[];
var MAXS=70;
function measure(){var r=wrap.getBoundingClientRect();W=Math.max(1,r.width);H=Math.max(1,r.height)}
function fitScale(box,padPx){return Math.min((W-2*padPx)/(box[2]-box[0]),(H-2*padPx)/(box[3]-box[1]))}
function minScale(){return fitScale(CB,8)*.8}
function clampCam(c){c.s=Math.max(minScale(),Math.min(MAXS,c.s));return c}
function render(){var vw=W/cam.s,vh=H/cam.s;svg.setAttribute('viewBox',(cam.x-vw/2).toFixed(3)+' '+(cam.y-vh/2).toFixed(3)+' '+vw.toFixed(3)+' '+vh.toFixed(3));lod()}
function queue(){if(raf)return;raf=requestAnimationFrame(function(){raf=null;render()})}
var bins=[['b1',4.0],['b2',3.0],['b3',2.2]],gl={};
Array.prototype.forEach.call(document.querySelectorAll('#labels g'),function(g){gl[g.getAttribute('data-bin')]=g});
function lod(){var any=false;bins.forEach(function(b){var on=cam.s*b[1]>=6.4;if(gl[b[0]])gl[b[0]].classList.toggle('show',on);if(on)any=true});
  $('zoomhint').hidden=any;$('z-in').disabled=cam.s>=MAXS-.01;$('z-out').disabled=cam.s<=minScale()+.001}
function insets(){var i={l:0,r:0,t:0,b:0};if(isMobile()){var p=$('panel');if(!p.hidden)i.b=p.getBoundingClientRect().height}return i}
function targetFor(box,fill,minS,maxS){var ins=insets(),aw=W-ins.l-ins.r,ah=H-ins.t-ins.b,w=box[2]-box[0],h=box[3]-box[1];
  var s=Math.max(minS,Math.min(maxS,fill*Math.min(aw,ah)/Math.max(w,h)));
  var cx=(box[0]+box[2])/2,cy=(box[1]+box[3])/2,dx=(ins.l-ins.r)/2,dy=(ins.t-ins.b)/2;
  return clampCam({x:cx-dx/s,y:cy-dy/s,s:s})}
function animateTo(t,ms){if(anim)cancelAnimationFrame(anim);var a={x:cam.x,y:cam.y,s:cam.s},t0=performance.now();ms=ms||420;
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){cam=t;render();return}
  (function step(now){var k=Math.min(1,(now-t0)/ms),e=1-Math.pow(1-k,3);
    cam.s=Math.exp(Math.log(a.s)+(Math.log(t.s)-Math.log(a.s))*e);
    // keep the point under the screen centre moving smoothly in screen space
    cam.x=a.x+(t.x-a.x)*e;cam.y=a.y+(t.y-a.y)*e;render();
    if(k<1)anim=requestAnimationFrame(step);else anim=null})(performance.now())}
function pushHist(){hist.push({cam:{x:cam.x,y:cam.y,s:cam.s},sel:sel&&{k:sel.k,i:sel.i}});if(hist.length>30)hist.shift();$('z-back').disabled=false}
function zoomAt(px,py,f){var r=wrap.getBoundingClientRect(),mx=cam.x+(px-r.left-W/2)/cam.s,my=cam.y+(py-r.top-H/2)/cam.s;
  var s=Math.max(minScale(),Math.min(MAXS,cam.s*f));cam.x=mx-(px-r.left-W/2)/s;cam.y=my-(py-r.top-H/2)/s;cam.s=s;queue()}
function fitMap(){pushHist();animateTo(targetFor(CB,1,0,MAXS))}

/* pointer: drag, pinch, wheel */
var pts=new Map(),drag=null,moved=false,pinch0=null;
wrap.addEventListener('pointerdown',function(e){if(e.target.closest('.ctl'))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=false;
  if(anim){cancelAnimationFrame(anim);anim=null}
  if(pts.size===1){drag={x:e.clientX,y:e.clientY,cx:cam.x,cy:cam.y}}
  if(pts.size===2){var a=Array.from(pts.values());pinch0={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),s:cam.s};drag=null}});
window.addEventListener('pointermove',function(e){if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size===2&&pinch0){var a=Array.from(pts.values()),d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);moved=true;
    zoomAt((a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2,(pinch0.s*d/pinch0.d)/cam.s);return}
  if(drag){var dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!moved&&Math.hypot(dx,dy)<5)return;moved=true;wrap.classList.add('drag');
    cam.x=drag.cx-dx/cam.s;cam.y=drag.cy-dy/cam.s;queue()}});
function up(e){pts.delete(e.pointerId);if(pts.size<2)pinch0=null;if(pts.size===0){drag=null;wrap.classList.remove('drag')}else if(pts.size===1){var p=Array.from(pts.values())[0];drag={x:p.x,y:p.y,cx:cam.x,cy:cam.y}}}
window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
wrap.addEventListener('wheel',function(e){e.preventDefault();var dy=e.deltaMode===1?e.deltaY*16:e.deltaY;zoomAt(e.clientX,e.clientY,Math.exp(-dy*(e.ctrlKey?.01:.0016)))},{passive:false});
svg.addEventListener('click',function(e){if(moved){moved=false;return}
  var l=e.target.closest('#lots [data-i]');if(l){selectLot(+l.getAttribute('data-i'));return}
  var r=e.target.closest('#review [data-r]');if(r){selectReview(+r.getAttribute('data-r'));return}
  if(sel&&!isMobile())clearSel()});
$('z-in').onclick=function(){var r=wrap.getBoundingClientRect();zoomAt(r.left+W/2,r.top+H/2,1.6)};
$('z-out').onclick=function(){var r=wrap.getBoundingClientRect();zoomAt(r.left+W/2,r.top+H/2,1/1.6)};
$('z-fit').onclick=fitMap;
$('z-back').onclick=function(){var h=hist.pop();if(!h)return;$('z-back').disabled=!hist.length;
  if(h.sel)applySel(h.sel.k,h.sel.i,true);else clearSel(true);animateTo(clampCam(h.cam))};
window.addEventListener('keydown',function(e){if(e.key==='Escape'){if($('modal-root').firstChild){closeModal();return}if(!$('results').hidden){$('results').hidden=true;return}if(sel)clearSel()}});
new ResizeObserver(function(){measure();render()}).observe(wrap);

/* ---------- selection ---------- */
var sel=null,RECS={},canEdit=false,dbns=null;
function polyPts(r){var e=elLot[r];return e?e.getAttribute('points'):null}

function setSelShape(k,i){var s=$('sel'),p=null;
  if(k==='lot'){var e=elLot[i];if(e&&e.tagName==='polygon')p=e.getAttribute('points');else if(e){var cx=+e.getAttribute('cx'),cy=+e.getAttribute('cy'),r=2.6;p=[[cx-r,cy-r],[cx+r,cy-r],[cx+r,cy+r],[cx-r,cy+r]].join(' ')}}
  if(k==='review'){var e2=elRv[i];if(e2&&e2.tagName==='polygon')p=e2.getAttribute('points');else{var rv=REVIEW[i],r2=2.6;p=[[rv.x-r2,rv.y-r2],[rv.x+r2,rv.y-r2],[rv.x+r2,rv.y+r2],[rv.x-r2,rv.y+r2]].join(' ')}}
  if(p){s.setAttribute('points',p);vis(s,true)}else vis(s,false)}
function boxOf(k,i){if(k==='lot'){var r=LOTS[i];return[r[7],r[8],r[9],r[10]]}
  if(k==='review'){var v=REVIEW[i];return v.b||[v.x-4,v.y-4,v.x+4,v.y+4]}
  var a=AREAS[UNPL[i].s];return a?a.b:CB}
function sheetPx(){var p=$('panel');document.documentElement.style.setProperty('--sheet-px',(isMobile()&&!p.hidden?Math.round(p.getBoundingClientRect().height):0)+'px')}
function applySel(k,i,noMove){if(isMobile()){$('side').hidden=true;$('b-browse').classList.remove('on');$('b-browse').setAttribute('aria-pressed','false')}sel={k:k,i:i};setSelShape(k,i);var hint=$('hint');vis(hint,false);
  if(k==='unplaced'){var a=AREAS[UNPL[i].s];if(a&&a.hull){hint.setAttribute('points',a.hull.map(function(p){return p.join(',')}).join(' '));vis(hint,true)}vis($('sel'),false)}
  renderPanel();if(!noMove)requestAnimationFrame(function(){requestAnimationFrame(function(){flyToSel()})});markList()}
function flyToSel(){if(!sel)return;measure();var b=boxOf(sel.k,sel.i);
  if(sel.k==='unplaced')animateTo(targetFor(b,.9,0,MAXS));else animateTo(targetFor(b,.2,8,22))}
function selectLot(i){if(sel&&sel.k==='lot'&&sel.i===i&&!$('panel').hidden){return}pushHist();applySel('lot',i)}
function selectReview(i){pushHist();applySel('review',i)}
function selectUnplaced(i){pushHist();applySel('unplaced',i)}
function clearSel(noHist){sel=null;vis($('sel'),false);vis($('hint'),false);$('panel').hidden=true;$('panel').innerHTML='';
  requestAnimationFrame(function(){measure();render();sheetPx()});markList()}

/* ---------- panel ---------- */
function evText(ev){return ev===0?'The label on the drawing matches this lot, and its legacy section was confirmed by a second, independent reading of the drawing.':'The label on the drawing matches this lot. Its legacy section follows from the surrounding lots, so the section is inferred, not read directly.'}
function areaOfSel(){return sel.k==='lot'?LOTS[sel.i][2]:sel.k==='unplaced'?UNPL[sel.i].s:(REVIEW[sel.i].r0||null)}
function renderPanel(){var p=$('panel');p.hidden=false;measure();if(isMobile())document.documentElement.style.setProperty('--sheet-h','48%');
  var h='';
  if(sel.k==='lot'){var r=LOTS[sel.i];
    h='<div class="p-head"><div><div class="p-h" id="p-h">'+esc(r[1])+'</div><div style="margin-top:8px"><span class="chip '+(r[11]===0?'ok':'gen')+'">'+(r[11]===0?'Verified lot':'Placed lot, section inferred')+'</span></div></div><button class="p-x" id="p-x" aria-label="Close details">&#10005;</button></div><div class="p-body">'
     +'<dl class="kv"><dt>Legacy reference</dt><dd>Section '+esc(r[2])+' &middot; Lot '+esc(r[3])+'</dd><dt>Map position</dt><dd>'+(r[12]?'Label position only (outline not drawn in the source)':'Outline drawn in the source')+'</dd></dl>'
     +'<p class="note" style="margin:0 0 4px">'+evText(r[11])+'</p>'
     +'<div id="rec-box"></div>'
     +'<div class="btns"><button class="btn" id="p-copy" type="button">Copy H-number</button><button class="btn" id="p-list" type="button">Add to list</button></div></div>'}
  else if(sel.k==='review'){var v=REVIEW[sel.i];
    h='<div class="p-head"><div><div class="p-h" style="font-size:22px">Needs review</div><div style="margin-top:8px"><span class="chip rv">Not shown as an H-number</span></div></div><button class="p-x" id="p-x" aria-label="Close details">&#10005;</button></div><div class="p-body">'
     +'<div class="box rvbox"><h3>Why</h3><ul style="margin:0;padding-left:18px">'+v.r.map(function(i){return '<li>'+esc(REASONS[i])+'</li>'}).join('')+'</ul></div>'
     +'<dl class="kv"><dt>Label on drawing</dt><dd class="mono">'+(v.t?esc(v.t):'(none)')+'</dd>'
     +(v.h?'<dt>Decoder candidate</dt><dd><span class="mono">'+esc(v.h)+'</span> &middot; Section '+esc(v.s)+' &middot; Lot '+esc(v.l)+'<br><span class="note">A candidate only. It is not drawn on the map until the conflict is settled.</span></dd>':'')
     +(v.c&&v.c.length&&!v.h?'<dt>Exists in sections</dt><dd>'+esc(v.c.slice(0,12).join(', '))+(v.c.length>12?' &hellip;':'')+'</dd>':'')+'</dl>'
     +'<p class="note">Position on the map is exact: this is the outlined lot (or label) the drawing shows. Its identity is what is unresolved.</p></div>'}
  else {var u=UNPL[sel.i],a=AREAS[u.s];
    h='<div class="p-head"><div><div class="p-h">'+esc(u.h)+'</div><div style="margin-top:8px"><span class="chip gen">Map position not resolved</span></div></div><button class="p-x" id="p-x" aria-label="Close details">&#10005;</button></div><div class="p-body">'
     +'<dl class="kv"><dt>Legacy reference</dt><dd>Section '+esc(u.s)+' &middot; Lot '+esc(u.l)+'</dd><dt>General area</dt><dd>Legacy section '+esc(u.s)+'</dd></dl>'
     +'<div class="box rvbox"><h3>Not an exact location</h3><p class="note" style="margin:0">The decoder knows this lot, but no label on the drawing could be tied to it. The dashed outline on the map only shows the general area of legacy section '+esc(u.s)+'.'+(u.n?' '+esc(u.n)+'.':'')+'</p></div>'
     +'<div id="rec-box"></div><div class="btns"><button class="btn" id="p-copy" type="button">Copy H-number</button></div></div>'}
  p.innerHTML=h;sheetPx();$('p-x').onclick=function(){clearSel()};
  var cp=$('p-copy');if(cp)cp.onclick=function(){copy(sel.k==='lot'?LOTS[sel.i][1]:UNPL[sel.i].h,'H-number copied')};
  var pl=$('p-list');if(pl)pl.onclick=function(){addToList(sel.i)};
  if(sel.k!=='review')renderRec()}

/* ---------- records ---------- */
function curH(){return sel.k==='lot'?LOTS[sel.i][1]:UNPL[sel.i].h}
function docFor(h){return RECS[h]||null}
function recSummary(rec){var o='';
  var cap=rec&&rec.capacity!=null&&rec.capacity!==''?'<b>'+esc(rec.capacity)+'</b> graves'+(rec.capacityVerified?' (verified)':' (not verified)'):'Grave count not verified';
  o+='<p class="empty" style="margin:0 0 6px">'+cap+'</p>';
  var rs=rec&&rec.records||[];
  if(!rs.length)o+='<p class="empty" style="margin:0">No grave records entered yet.</p>';
  rs.forEach(function(r){var dates=[r.birth,r.death].filter(Boolean).join(' \u2013 ');
    o+='<div class="rec"><div class="nm">'+esc(r.name||'(no name)')+'</div>'+(dates?'<div class="d">'+esc(dates)+'</div>':'')
      +'<div class="d">Position: '+(r.position?esc(r.position):'not recorded')+' <span class="badge'+(r.positionVerified?' v':'')+'">'+(r.positionVerified?'verified':'not verified')+'</span></div>'
      +(r.notes?'<div class="d" style="white-space:pre-wrap;margin-top:4px">'+esc(r.notes)+'</div>':'')+(r.source?'<div class="d">Source: '+esc(r.source)+'</div>':'')+'</div>'});
  if(rec&&(rec.notes||rec.note||rec.source))o+='<div class="rec">'+((rec.notes||rec.note)?'<div class="d" style="white-space:pre-wrap">'+esc(rec.notes||rec.note)+'</div>':'')+(rec.source?'<div class="d">Source: '+esc(rec.source)+'</div>':'')+'</div>';
  return o}
function renderRec(){var box=$('rec-box');if(!box)return;var h=curH(),rec=docFor(h);
  box.innerHTML='<div class="box"><h3>Grave information</h3>'+recSummary(rec)
   +(canEdit?'<div class="btns"><button class="btn pri" id="r-edit" type="button">Edit record</button></div>':'<p class="note" style="margin:10px 0 0">'+(dbns?'Records can be edited by people with edit access.':'Shared records are not available in this view.')+'</p>')+'</div>';
  var eb=$('r-edit');if(eb)eb.onclick=function(){renderForm(rec)}}
function f(id,lbl,val,type,ph){return '<label for="'+id+'">'+lbl+'</label><input class="field" id="'+id+'" type="'+(type||'text')+'" value="'+esc(val==null?'':val)+'"'+(ph?' placeholder="'+esc(ph)+'"':'')+'>'}
function recForm(r,k){return '<div class="rform" data-k="'+k+'">'+f('rn'+k,'Name',r.name)+'<div class="two"><div>'+f('rb'+k,'Birth',r.birth,'text','e.g. 1931 or 4 Mar 1931')+'</div><div>'+f('rd'+k,'Death',r.death,'text','e.g. 2004')+'</div></div>'
  +f('rp'+k,'Grave position',r.position,'text','e.g. east half, row 2')+'<label class="chk"><input type="checkbox" id="rv'+k+'"'+(r.positionVerified?' checked':'')+'> Position verified on site or in a source</label>'
  +'<label for="rt'+k+'">Notes</label><textarea class="field" id="rt'+k+'">'+esc(r.notes||'')+'</textarea>'+f('rs'+k,'Source reference',r.source,'text','e.g. burial register p. 42')
  +'<div class="btns" style="margin-top:8px"><button type="button" class="btn dng" data-del="'+k+'" style="height:32px;font-size:12.5px">Remove this record</button></div></div>'}
var formN=0;
function renderForm(rec){var box=$('rec-box'),rs=(rec&&rec.records||[]).map(function(r){return Object.assign({},r)});formN=0;
  box.innerHTML='<div class="box form"><h3>Edit grave information</h3>'
   +'<div class="two"><div>'+f('c-cap','Grave count',rec&&rec.capacity,'number','unknown')+'</div><div><label class="chk" style="margin-top:30px"><input type="checkbox" id="c-ver"'+(rec&&rec.capacityVerified?' checked':'')+'> Count verified</label></div></div>'
   +'<div id="rforms">'+rs.map(function(r){return recForm(r,formN++)}).join('')+'</div>'
   +'<div class="btns"><button class="btn" id="r-add" type="button">Add a record</button></div>'
   +'<details'+((rec&&(rec.notes||rec.source))?' open':'')+'><summary>Lot notes and source</summary><label for="c-notes">Lot notes</label><textarea class="field" id="c-notes">'+esc(rec&&(rec.notes||rec.note)||'')+'</textarea>'+f('c-src','Lot source reference',rec&&rec.source)+'</details>'
   +'<div class="btns"><button class="btn pri" id="r-save" type="button">Save</button><button class="btn" id="r-cancel" type="button">Cancel</button></div><div class="status" id="r-status"></div></div>';
  $('r-add').onclick=function(){var d=document.createElement('div');d.innerHTML=recForm({},formN++);$('rforms').appendChild(d.firstChild)};
  $('rforms').addEventListener('click',function(e){var b=e.target.closest('[data-del]');if(b){var el=b.closest('.rform');el.parentNode.removeChild(el)}});
  $('r-cancel').onclick=renderRec;
  $('r-save').onclick=function(){var h=curH(),out=[];
    Array.prototype.forEach.call(document.querySelectorAll('.rform'),function(el){var k=el.getAttribute('data-k'),g=function(p){var n=$(p+k);return n?n.value.trim():''};
      var r={name:g('rn'),birth:g('rb'),death:g('rd'),position:g('rp'),positionVerified:$('rv'+k).checked,notes:g('rt'),source:g('rs')};
      if(r.name||r.birth||r.death||r.position||r.notes||r.source)out.push(r)});
    var cap=$('c-cap').value.trim(),doc={h:h,capacity:cap===''?null:Math.max(0,parseInt(cap,10)||0),capacityVerified:$('c-ver').checked&&cap!=='',records:out,notes:$('c-notes').value.trim(),source:$('c-src').value.trim(),updated:new Date().toISOString()};
    var st=$('r-status');st.className='status';st.textContent='Saving…';$('r-save').disabled=true;
    writeDoc(h,doc).then(function(){st.className='status ok';st.textContent='Saved';RECS[h]=doc;indexNames();markRecs();setTimeout(renderRec,500)},
      function(err){$('r-save').disabled=false;st.className='status err';st.textContent=(err&&err.code==='invalid_argument')?'You do not have edit access, so this was not saved.':'Not saved: '+(err&&err.message||'try again')})}}
function writeDoc(h,doc){if(!dbns)return Promise.reject({message:'Shared records are not available in this view.'});return dbns.doc('lots/'+h).set(doc)}

/* ---------- lists (to print / export) ---------- */
var LIST=[];try{LIST=JSON.parse(localStorage.getItem('cg_list')||'[]')}catch(e){}
function addToList(i){var h=LOTS[i][1];if(LIST.indexOf(h)<0)LIST.push(h);try{localStorage.setItem('cg_list',JSON.stringify(LIST))}catch(e){}toast('Added '+h+' ('+LIST.length+' on your list)')}

/* ---------- search ---------- */
var NAMEIDX=[];
function indexNames(){NAMEIDX=[];Object.keys(RECS).forEach(function(h){((RECS[h]&&RECS[h].records)||[]).forEach(function(r){if(r.name)NAMEIDX.push({h:h,n:r.name,lc:r.name.toLowerCase()})})})}
function markRecs(){elLot.forEach(function(e,i){if(e)e.classList.toggle('hasrec',!!(RECS[LOTS[i][1]]&&((RECS[LOTS[i][1]].records||[]).length)))});
  $('lg-rec').hidden=!Object.keys(RECS).some(function(h){return(RECS[h].records||[]).length})}
function search(raw){var q=raw.trim();if(!q)return[];var out=[],seen={};
  function add(o){var k=o.k+':'+o.i;if(seen[k])return;seen[k]=1;out.push(o)}
  var up=q.toUpperCase().replace(/\s+/g,' ');
  // H-number (incl. grave id H + 6 digit lot + grave digit)
  var m=up.replace(/[\s-]/g,'').match(/^H?0*(\d{1,7})([A-Z]?)$/),dig=m&&m[1];
  var gm=up.replace(/[\s-]/g,'').match(/^H(\d{6})(\d)$/);
  var cand=[];if(gm)cand.push({n:parseInt(gm[1],10),sfx:'',grave:gm[2]});
  if(m)cand.push({n:parseInt(m[1],10),sfx:m[2]});
  cand.forEach(function(c){LOTS.forEach(function(r,i){if(r[4]===c.n&&(!c.sfx||r[1].slice(-1)===c.sfx))add({k:'lot',i:i,rank:0,grave:c.grave})});
    UNPL.forEach(function(u,i){if(hnum(u.h)===c.n&&(!c.sfx||u.h.slice(-1)===c.sfx))add({k:'unplaced',i:i,rank:2})});
    REVIEW.forEach(function(v,i){if(v.h&&hnum(v.h)===c.n)add({k:'review',i:i,rank:3})})});
  // legacy: "B 20H", "section b lot 20h", "B-20H"
  var lm=up.replace(/^SECTION\s*/,'').replace(/\bLOT\b/,' ').match(/^([A-M])\s*[-:\s]\s*(\d+[A-Z]*(?:_\d+)?)$/)||up.replace(/^SECTION\s*/,'').match(/^([A-M])(\d+[A-Z]*)$/);
  if(lm){var key=lm[1]+'|'+lm[2];if(byLeg[key]!==undefined)add({k:'lot',i:byLeg[key],rank:0});
    UNPL.forEach(function(u,i){if(u.s===lm[1]&&u.l===lm[2])add({k:'unplaced',i:i,rank:1})});
    REVIEW.forEach(function(v,i){if(v.s===lm[1]&&v.l===lm[2])add({k:'review',i:i,rank:1})})}
  if(lm&&byLeg[lm[1]+'|'+lm[2]]===undefined){LOTS.forEach(function(r,i){if(r[2]===lm[1]&&r[3].indexOf(lm[2])===0)add({k:'lot',i:i,rank:1+(r[3].length-lm[2].length)/10})})}
  // bare legacy label (20H, 19) in any section
  var bare=up.replace(/\s/g,'');if(/^\d+[A-Z]*(_\d+)?$/.test(bare))LOTS.forEach(function(r,i){if(r[3]===bare)add({k:'lot',i:i,rank:5})});
  // names
  if(q.length>=2){var ql=q.toLowerCase();NAMEIDX.forEach(function(n){if(n.lc.indexOf(ql)>=0){var ix=byH[n.h];if(ix)add({k:'lot',i:ix[0],rank:4,name:n.n});else{var ui=UNPL.findIndex(function(u){return u.h===n.h});if(ui>=0)add({k:'unplaced',i:ui,rank:4,name:n.n})}}})}

  else{h='<p class="eyebrow">Needs review</p><p class="note" style="margin:0 0 6px">Nothing here is drawn as an H-number. Positions are exact where an outline exists; identity is what is unresolved.</p>'

    var groups={};REVIEW.forEach(function(v,i){var k=v.r[0];(groups[k]=groups[k]||[]).push(i)});

      +groups[k].slice(0,60).map(function(i){var v=REVIEW[i];return '<button type="button" class="li" data-rv="'+i+'"><span class="h">'+esc(v.h||v.t||'(no label)')+'</span><span class="l">'+(v.s?'Sec '+esc(v.s)+' lot '+esc(v.l):'')+'</span></button>'}).join('')
      +(groups[k].length>60?'<div class="note" style="padding:8px 12px">+ '+(groups[k].length-60)+' more in the CSV</div>':'')+'</div>'});
    h+='<div class="reason-h">Known H-numbers with no position on the map ('+UNPL.length+')</div><div class="lotlist">'+UNPL.map(function(u,i){return '<button type="button" class="li" data-un="'+i+'"><span class="h">'+esc(u.h)+'</span><span class="l">Sec '+esc(u.s)+' lot '+esc(u.l)+'</span></button>'}).join('')+'</div>';
    b.innerHTML=h;$('rv-csv').onclick=exportReviewCsv;

  markList()}

function saveFile(name,data,type){return Promise.resolve(window.claude&&window.claude.use?window.claude.use('downloads'):null).then(function(dl){
  if(!dl){toast('Downloads are not available in this view');return}return dl.save({filename:name,data:data}).then(function(){toast('Saved '+name)},function(err){if(err&&err.code!=='cancelled'&&err.code!=='declined')toast('Could not save the file')})})}
function exportPdf(key){var p=PDFS[key];if(!p){toast('That PDF is not available');return}toast('Preparing '+p.name+'…');
  fetch(p.file).then(function(r){if(!r.ok)throw 0;return r.blob()}).then(function(b){return saveFile(p.name,b)}).catch(function(){toast('The PDF could not be loaded in this view')})}
function csv(rows){return rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n')}
function exportReviewCsv(){var rows=[['status','reason','h_number_candidate','legacy_section','legacy_lot','label_on_drawing','map_x','map_y']];
  REVIEW.forEach(function(v){rows.push(['needs_review',v.r.map(function(i){return REASONS[i]}).join(' | '),v.h||'',v.s||'',v.l||'',v.t||'',v.x,v.y])});
  UNPL.forEach(function(u){rows.push(['known_h_no_map_position',u.n||'Decoder lot with no matching label on the drawing',u.h,u.s,u.l,'','',''])});
  saveFile('Cedar_Grove_unresolved_locations.csv',new Blob([csv(rows)],{type:'text/csv'}))}
function exportLotsCsv(){var rows=[['h_number','legacy_section','legacy_lot','section_evidence']];LOTS.forEach(function(r){rows.push([r[1],r[2],r[3],r[11]===0?'two independent readings':'inferred from surrounding lots'])});
  saveFile('Cedar_Grove_lots_with_H-numbers.csv',new Blob([csv(rows)],{type:'text/csv'}))}
function exportListCsv(){if(!LIST.length){toast('Your list is empty. Open a lot and choose Add to list.');return}
  var rows=[['h_number','legacy_section','legacy_lot','name','birth','death','notes']];LIST.forEach(function(h){var ix=byH[h];if(!ix)return;var r=LOTS[ix[0]],d=RECS[h],rs=(d&&d.records)||[];
    if(!rs.length)rows.push([h,r[2],r[3],'','','','']);rs.forEach(function(x){rows.push([h,r[2],r[3],x.name,x.birth,x.death,x.notes])})});

$('b-export').onclick=function(){var areas=Object.keys(AREAS).sort();

var XLSX_URL='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
function loadScript(src){return new Promise(function(res,rej){var s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
function parseCsv(t){var rows=[],row=[],c='',q=false;for(var i=0;i<t.length;i++){var ch=t[i];if(q){if(ch==='"'){if(t[i+1]==='"'){c+='"';i++}else q=false}else c+=ch}else if(ch==='"')q=true;else if(ch===','){row.push(c);c=''}else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&t[i+1]==='\n')i++;row.push(c);rows.push(row);row=[];c=''}else c+=ch}
  if(c||row.length){row.push(c);rows.push(row)}return rows.filter(function(r){return r.some(function(x){return String(x).trim()})})}
var COLS={h:['h_number','h','hnumber','h-number'],s:['section','legacy_section'],l:['lot','legacy_lot','lot_label'],name:['name','full_name'],birth:['birth','born','birth_date'],death:['death','died','death_date'],notes:['notes','note'],source:['source','source_reference'],position:['position','grave_position','grave'],pv:['position_verified','verified']};
function colIdx(head,keys){for(var i=0;i<head.length;i++){if(keys.indexOf(String(head[i]).trim().toLowerCase().replace(/\s+/g,'_'))>=0)return i}return -1}
function importRows(rows){var head=rows[0],ix={};Object.keys(COLS).forEach(function(k){ix[k]=colIdx(head,COLS[k])});
  var out={},ok=0,skipped=[];rows.slice(1).forEach(function(r,n){var h=ix.h>=0?String(r[ix.h]).trim().toUpperCase():'',lot=null;
    if(h){var mm=h.replace(/\s/g,'').match(/^H?0*(\d+)([A-Z]?)$/);if(mm){var key='H'+('000000'+mm[1]).slice(-6)+mm[2];if(byH[key])lot=key}}
    if(!lot&&ix.s>=0&&ix.l>=0){var k2=String(r[ix.s]).trim().toUpperCase()+'|'+String(r[ix.l]).trim().toUpperCase();if(byLeg[k2]!==undefined)lot=LOTS[byLeg[k2]][1]}
    if(!lot){skipped.push(n+2);return}
    var g=function(k){return ix[k]>=0?String(r[ix[k]]||'').trim():''};
    var rec={name:g('name'),birth:g('birth'),death:g('death'),position:g('position'),positionVerified:/^(y|yes|true|1|verified)$/i.test(g('pv')),notes:g('notes'),source:g('source')};
    if(!(rec.name||rec.birth||rec.death||rec.notes||rec.position)){skipped.push(n+2);return}
    (out[lot]=out[lot]||[]).push(rec);ok++});
  return{byLot:out,ok:ok,skipped:skipped,found:{h:ix.h>=0,sl:ix.s>=0&&ix.l>=0,name:ix.name>=0}}}
$('b-import').onclick=function(){openModal('<h2>Import grave records</h2><p class="note" style="margin:0 0 10px">Choose a CSV or Excel file. Each row is matched to a lot by <b>h_number</b>, or by <b>section</b> and <b>lot</b>. Other columns: name, birth, death, position, position_verified, notes, source. Rows that match no lot are skipped and listed. Records are added to what each lot already has.</p><input type="file" id="imp-f" accept=".csv,.xlsx,.xls" class="field" style="height:auto;padding:10px"><div id="imp-out" style="margin-top:12px"></div><div class="btns" style="justify-content:flex-end"><button class="btn" data-close>Close</button></div>');
  $('imp-f').onchange=function(){var f=this.files[0];if(!f)return;var out=$('imp-out');out.textContent='Reading…';
    var go=function(rows){var res=importRows(rows);
      if(!res.found.h&&!res.found.sl){out.innerHTML='<p class="status err">No h_number column, and no section + lot columns, were found in the first row.</p>';return}
      var lots=Object.keys(res.byLot);out.innerHTML='<p><b>'+res.ok+'</b> records for <b>'+lots.length+'</b> lots are ready. <b>'+res.skipped.length+'</b> rows were skipped'+(res.skipped.length?' (rows '+res.skipped.slice(0,20).join(', ')+(res.skipped.length>20?' &hellip;':'')+')':'')+'.</p><div class="btns"><button class="btn pri" id="imp-go" type="button"'+(lots.length?'':' disabled')+'>Add to records</button></div><div class="status" id="imp-st"></div>';
      $('imp-go').onclick=function(){var b=this;b.disabled=true;var n=0,fail=0,st=$('imp-st');
        (function next(){if(!lots.length){st.className='status '+(fail?'err':'ok');st.textContent='Added records to '+n+' lots'+(fail?'; '+fail+' could not be saved (edit access needed).':'.');markRecs();return}
          var h=lots.shift(),ex=RECS[h]||{h:h,capacity:null,capacityVerified:false,records:[],notes:'',source:''};
          var doc=Object.assign({},ex,{records:(ex.records||[]).concat(res.byLot[h]),updated:new Date().toISOString()});
          writeDoc(h,doc).then(function(){RECS[h]=doc;n++;st.textContent='Saving… '+n},function(){fail++}).then(next)})()}};
    if(/\.csv$/i.test(f.name)){var fr=new FileReader();fr.onload=function(){go(parseCsv(String(fr.result)))};fr.readAsText(f)}
    else loadScript(XLSX_URL).then(function(){var fr=new FileReader();fr.onload=function(){var wb=XLSX.read(fr.result,{type:'array'}),ws=wb.Sheets[wb.SheetNames[0]];go(XLSX.utils.sheet_to_json(ws,{header:1,raw:false,defval:''}))};fr.readAsArrayBuffer(f)},function(){out.innerHTML='<p class="status err">The Excel reader could not be loaded. Save the sheet as CSV and try again.</p>'})}};
